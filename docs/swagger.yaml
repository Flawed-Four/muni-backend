basePath: /api/v1
definitions:
  dto.CreateNoteRequest:
    properties:
      content:
        example: Discussed the new roadmap...
        type: string
      title:
        example: My Meeting Notes
        maxLength: 255
        minLength: 1
        type: string
    required:
    - content
    - title
    type: object
  dto.CreateNoteTagRequest:
    properties:
      note_id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      title:
        example: work
        maxLength: 255
        minLength: 1
        type: string
    required:
    - note_id
    - title
    type: object
  dto.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: harun@example.com
        type: string
      password:
        example: s3cretpass
        type: string
    required:
    - email
    - password
    type: object
  dto.NoteEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.NoteResponse'
    type: object
  dto.NoteListEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.NoteListResponse'
    type: object
  dto.NoteListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.NoteResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.NoteResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      tags:
        items:
          $ref: '#/definitions/dto.NoteTagResponse'
        type: array
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.NoteTagEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.NoteTagResponse'
    type: object
  dto.NoteTagListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.NoteTagResponse'
        type: array
    type: object
  dto.NoteTagResponse:
    properties:
      id:
        type: string
      note_id:
        type: string
      title:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: harun@example.com
        maxLength: 254
        type: string
      name:
        example: Harun
        maxLength: 100
        minLength: 1
        type: string
      password:
        example: s3cretpass
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.TokenEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.TokenResponse'
    type: object
  dto.TokenResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  dto.UpdateNoteRequest:
    properties:
      content:
        example: Discussed the new roadmap and timeline...
        type: string
      title:
        example: Updated Meeting Notes
        maxLength: 255
        minLength: 1
        type: string
    required:
    - content
    - title
    type: object
  dto.UpdateNoteTagRequest:
    properties:
      title:
        example: personal
        maxLength: 255
        minLength: 1
        type: string
    required:
    - title
    type: object
  dto.UserEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        example: user
        type: string
    type: object
  response.Error:
    properties:
      error:
        $ref: '#/definitions/response.ErrorBody'
    type: object
  response.ErrorBody:
    properties:
      message:
        type: string
    type: object
info:
  contact: {}
  description: Muni backend service.
  title: Muni API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TokenEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
      summary: Log in and obtain a session token
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Revoke the current session
      tags:
      - auth
  /auth/logout-all:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Revoke all sessions of the authenticated user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Error'
      summary: Register a new user
      tags:
      - auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Error'
      summary: Liveness and database readiness check
      tags:
      - health
  /notes:
    get:
      parameters:
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10)'
        in: query
        name: limit
        type: integer
      - description: Offset (overrides page if set)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NoteListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: List notes
      tags:
      - notes
    post:
      consumes:
      - application/json
      parameters:
      - description: Note payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateNoteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.NoteEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Create a new note
      tags:
      - notes
  /notes/{id}:
    delete:
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Delete a note
      tags:
      - notes
    get:
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NoteEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Get a note by ID
      tags:
      - notes
    put:
      consumes:
      - application/json
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NoteEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Update a note
      tags:
      - notes
  /notes/{id}/tags:
    get:
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NoteTagListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: List tags for a note
      tags:
      - notes
  /tags:
    get:
      parameters:
      - description: Note ID
        in: query
        name: note_id
        type: string
      - description: Tag Title
        in: query
        name: title
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10)'
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NoteTagListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: List tags
      tags:
      - tags
    post:
      consumes:
      - application/json
      parameters:
      - description: Tag payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateNoteTagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.NoteTagEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Add a tag to a note
      tags:
      - tags
  /tags/{id}:
    delete:
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Delete a tag
      tags:
      - tags
    get:
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NoteTagEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Get a tag by ID
      tags:
      - tags
    put:
      consumes:
      - application/json
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateNoteTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NoteTagEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Update a tag
      tags:
      - tags
  /users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - BearerAuth: []
      summary: Get the authenticated user's profile
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the session token returned
      by /auth/login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
