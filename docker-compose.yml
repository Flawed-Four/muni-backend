services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: ${DB_USER:-moni}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moni}
      POSTGRES_DB: ${DB_NAME:-moni}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-moni} -d ${DB_NAME:-moni}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Disposable database for automated tests (see `make test`). Data lives in tmpfs.
  postgres-test:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    profiles: ["test"]
    environment:
      POSTGRES_USER: moni_test
      POSTGRES_PASSWORD: moni_test
      POSTGRES_DB: moni_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moni_test -d moni_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-moni}:${DB_PASSWORD:-moni}@postgres:5432/${DB_NAME:-moni}?sslmode=disable
      - up

  app:
    build: .
    profiles: ["app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-moni}
      DB_PASSWORD: ${DB_PASSWORD:-moni}
      DB_NAME: ${DB_NAME:-moni}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL: ${JWT_TTL:-24h}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
