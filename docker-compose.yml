# restart: "no" on every service: containers stop on shutdown and do not start on boot.
# Start them with `make docker-up` or `make test-db-up`.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: "no"
    environment:
      POSTGRES_USER: ${DB_USER:-muni}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-muni}
      POSTGRES_DB: ${DB_NAME:-muni}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-muni} -d ${DB_NAME:-muni}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Disposable database for automated tests (see `make test`). Data lives in tmpfs.
  postgres-test:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: "no"
    profiles: ["test"]
    environment:
      POSTGRES_USER: muni_test
      POSTGRES_PASSWORD: muni_test
      POSTGRES_DB: muni_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muni_test -d muni_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Local mail catcher: accepts everything on 1025, delivers nothing. UI on 8025.
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: "no"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Disposable mail catcher for automated tests (see `make test`).
  mailpit-test:
    image: axllent/mailpit:v1.33.0
    restart: "no"
    profiles: ["test"]
    ports:
      - "127.0.0.1:${TEST_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${TEST_MAILPIT_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Local Redis without a password, so it must stay bound to loopback.
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: "no"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Disposable Redis for automated tests (see `make test`). Nothing is written to disk.
  redis-test:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: "no"
    profiles: ["test"]
    command: ["redis-server", "--save", ""]
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Local Chroma without auth, so it must stay bound to loopback.
  # The image has no curl, so the healthcheck sends HTTP through bash.
  # nofile: Chroma keeps files open even for deleted collections; 1024 runs out.
  chroma:
    image: ${CHROMA_IMAGE:-ghcr.io/chroma-core/chroma:1.5.9}
    restart: "no"
    ulimits:
      nofile: 65536
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8000}:8000"
    volumes:
      - chromadata:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Disposable Chroma for automated tests (see `make test`). Data lives in tmpfs.
  chroma-test:
    image: ${CHROMA_IMAGE:-ghcr.io/chroma-core/chroma:1.5.9}
    restart: "no"
    profiles: ["test"]
    ulimits:
      nofile: 65536
    ports:
      - "127.0.0.1:${TEST_CHROMA_PORT:-58000}:8000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.20.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-muni}:${DB_PASSWORD:-muni}@postgres:5432/${DB_NAME:-muni}?sslmode=disable
      - up

  app:
    build: .
    restart: "no"
    profiles: ["app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-muni}
      DB_PASSWORD: ${DB_PASSWORD:-muni}
      DB_NAME: ${DB_NAME:-muni}
      DB_SSLMODE: disable
      SESSION_TTL: ${SESSION_TTL:-24h}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS_MODE: none
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@muni.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Muni}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
  chromadata:
